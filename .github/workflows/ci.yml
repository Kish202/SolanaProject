name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # OIDC to AWS, no long-lived keys in GitHub

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://solana:solana@localhost:5432/solana_trade
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # PostgreSQL ships preinstalled on GitHub's Ubuntu runners; start it natively.
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER solana WITH PASSWORD 'solana' CREATEDB;"
          sudo -u postgres createdb -O solana solana_trade
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migrations apply cleanly (and are idempotent)
        run: npm run migrate && npm run migrate
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Optional AWS deploy (Elastic Beanstalk, Node.js platform). Skipped unless the
  # EB_APP_NAME repository variable is set, so Render/Vercel-only setups are unaffected.
  deploy-aws:
    needs: [test, web]
    if: github.ref == 'refs/heads/main' && vars.EB_APP_NAME != ''
    runs-on: ubuntu-latest
    environment: production # add required reviewers in GitHub settings for a manual gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Package bundle
        run: |
          echo "web: npm run start:prod" > Procfile
          zip -qr bundle.zip dist package.json package-lock.json Procfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload and deploy
        run: |
          VERSION="${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          aws s3 cp bundle.zip "s3://${{ vars.EB_BUNDLE_BUCKET }}/${{ vars.EB_APP_NAME }}/$VERSION.zip"
          aws elasticbeanstalk create-application-version \
            --application-name "${{ vars.EB_APP_NAME }}" --version-label "$VERSION" \
            --source-bundle S3Bucket="${{ vars.EB_BUNDLE_BUCKET }}",S3Key="${{ vars.EB_APP_NAME }}/$VERSION.zip"
          aws elasticbeanstalk update-environment \
            --environment-name "${{ vars.EB_ENV_NAME }}" --version-label "$VERSION"
          aws elasticbeanstalk wait environment-updated --environment-names "${{ vars.EB_ENV_NAME }}"
          HEALTH=$(aws elasticbeanstalk describe-environments --environment-names "${{ vars.EB_ENV_NAME }}" \
            --query 'Environments[0].Health' --output text)
          echo "Environment health: $HEALTH"
          test "$HEALTH" = "Green"
